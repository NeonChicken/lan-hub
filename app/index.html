<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Hub</title>
<link rel="icon" href="assets/app.ico" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<meta name="theme-color" content="#2e222f">
<style>
/* Outfit (SIL Open Font License, assets/fonts/OFL.txt), bundled so nothing loads from the internet */
@font-face{font-family:"Outfit";font-style:normal;font-weight:400 800;font-display:swap;src:url(assets/fonts/outfit-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Outfit";font-style:normal;font-weight:400 800;font-display:swap;src:url(assets/fonts/outfit-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  /* resurrect-64 palette (matches the app icon) */
  --bg:#2e222f; --ink:#2e222f; --surface:#3e3546; --surface-2:#4a3f54;
  --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.1); --glass-3:rgba(255,255,255,.16);
  --solid:rgba(62,53,70,.82); --solid-2:rgba(74,63,84,.94);
  --stroke:rgba(255,255,255,.13); --stroke-2:rgba(255,255,255,.24);
  --text:#fbf7fd; --muted:#b8adc2; --dim:#8a7b95;
  --c1:#f57d4a; --c1d:#9e4539; --c2:#a884f3; --c2d:#905ea9; --c3:#f04f78;
  --ok:#91db69; --warn:#fbb954; --bad:#e83b3b; --sky:#8fd3ff;
  --grad:linear-gradient(120deg,var(--c1),var(--c2));
  --card-w:300px; --gutter:28px;
  --blur:saturate(160%) blur(18px);
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
img{display:block}
code{font-family:ui-monospace,Consolas,monospace;font-size:.85em;background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px;word-break:break-all}
::selection{background:var(--c2);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:10px}::-webkit-scrollbar-track{background:transparent}

/* ---------- ambient background: static, cheap (no animated blur under glass) ---------- */
.ambient{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;
  background:radial-gradient(60vmax 60vmax at 95% -10%,rgba(168,132,243,.28),transparent 60%),
             radial-gradient(55vmax 55vmax at -10% 110%,rgba(245,125,74,.20),transparent 60%),
             radial-gradient(35vmax 35vmax at 55% 55%,rgba(144,94,169,.16),transparent 60%),var(--bg)}
/* blurred game art: drawn at 1/8 size then scaled up = ~64x cheaper than blurring full-screen */
.ambient .bgart{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transform:scale(8);transform-origin:0 0;
  background-size:cover;background-position:center;filter:blur(5px) saturate(150%);opacity:0;transition:opacity 1s ease}
.ambient .bgart.on{opacity:.26}

/* ---------- primitives ---------- */
.glass{background:var(--glass);border:1px solid var(--stroke);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:0 10px 40px -12px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
.pane{background:var(--solid);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.btn{display:inline-flex;align-items:center;gap:.55em;padding:.72em 1.25em;border-radius:12px;font-weight:600;letter-spacing:.01em;transition:transform .15s,background-color .15s,border-color .15s,filter .15s;white-space:nowrap;text-decoration:none;color:inherit}
.btn svg{width:1.15em;height:1.15em;flex:none}
.btn:active{transform:scale(.96)}
.btn-primary{background:#fff;color:#2e222f}
.btn-primary:hover{background:#f3ecff}
.btn-grad{background:var(--c1);color:var(--ink);box-shadow:0 4px 0 var(--c1d)}
.btn-grad:hover{filter:brightness(1.07)}
.btn-grad:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c1d)}
.btn-purple{background:var(--c2);color:var(--ink);box-shadow:0 4px 0 var(--c2d)}
.btn-purple:hover{filter:brightness(1.07)}
.btn-purple:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c2d)}
.btn-glass{background:var(--glass-2);border:1px solid var(--stroke)}
.btn-glass:hover{background:var(--glass-3);border-color:var(--stroke-2)}
.btn-sm{padding:.5em .9em;font-size:.86rem;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.28em .7em;border-radius:999px;font-size:.78rem;font-weight:600;background:rgba(255,255,255,.08);border:1px solid var(--stroke);white-space:nowrap}
.chip.lan{background:rgba(145,219,105,.14);border-color:rgba(145,219,105,.4);color:#d4f4bf}
.chip.online{background:rgba(143,211,255,.12);border-color:rgba(143,211,255,.35);color:#d2efff}
.chip.couch{background:rgba(240,79,120,.13);border-color:rgba(240,79,120,.4);color:#ffc8d6}
.chip.notinst{background:rgba(251,185,84,.12);border-color:rgba(251,185,84,.4);color:#ffe1ad}
.chip.star{background:rgba(168,132,243,.18);border-color:rgba(168,132,243,.5);color:#e3d6ff}
.dot{width:.5em;height:.5em;border-radius:50%;background:currentColor;display:inline-block}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:50;padding:12px var(--gutter);display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid transparent;transition:background-color .25s,border-color .25s}
.top.scrolled{background:rgba(46,34,47,.72);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom-color:var(--stroke)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.4rem;letter-spacing:.07em;user-select:none}
.brand img{width:40px;height:40px;image-rendering:pixelated;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.brand .l{color:var(--c1);text-shadow:0 3px 0 var(--c1d)}
.brand .h{color:var(--c2);text-shadow:0 3px 0 var(--c2d)}
.search{flex:1 1 220px;max-width:440px;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;transition:border-color .2s,background-color .2s}
.search:focus-within{border-color:rgba(168,132,243,.6);background:var(--solid-2)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search kbd{font-family:inherit;font-size:.72rem;color:var(--dim);border:1px solid var(--stroke);padding:1px 6px;border-radius:6px}
.squad{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 14px;border-radius:12px}
.squad label{font-size:.82rem;color:var(--muted);white-space:nowrap}
.squad .num{min-width:2.2ch;text-align:center;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.squad button{width:30px;height:30px;border-radius:9px;background:var(--glass-2);display:grid;place-items:center;font-size:1.1rem;font-weight:700}
.squad button:hover{background:var(--glass-3)}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.iconbtn:hover{background:var(--glass-3)}
.status{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);padding:9px 12px;border-radius:12px;cursor:default;max-width:340px}
.status .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .dot{width:8px;height:8px;flex:none;background:var(--dim)}
.status.on .dot{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.status.off .dot{background:var(--warn)}
.status.err .dot{background:var(--bad);box-shadow:0 0 12px var(--bad)}
.status.busy .dot{background:var(--sky);box-shadow:0 0 12px var(--sky);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

.banner{margin:4px var(--gutter) 14px;padding:14px 18px;border-radius:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.93rem;line-height:1.5;position:relative;z-index:6}
.banner b{color:#fff}
.banner .x{margin-left:auto}

.filters{display:flex;gap:8px;flex-wrap:wrap;padding:0 var(--gutter) 6px;position:relative;z-index:5}
.fchip{padding:.5em 1em;border-radius:999px;font-size:.86rem;font-weight:600;color:var(--muted);background:var(--solid);border:1px solid var(--stroke);transition:color .15s,background-color .15s,border-color .15s}
.fchip:hover{color:var(--text);border-color:var(--stroke-2)}
.fchip.on{color:#2e222f;background:#fff;border-color:#fff}
.fchip .n{opacity:.6;margin-left:.35em;font-variant-numeric:tabular-nums}
.viewtoggle{margin-left:auto;display:flex;gap:4px;padding:4px;border-radius:999px}
.viewtoggle button{padding:.38em .9em;border-radius:999px;font-size:.82rem;font-weight:600;color:var(--muted)}
.viewtoggle button.on{background:var(--glass-3);color:var(--text)}

/* ---------- hero billboard ---------- */
.hero{position:relative;min-height:min(72vh,720px);margin-top:calc(-1 * var(--top-h, 64px));overflow:hidden;contain:paint;
  display:flex;align-items:flex-end;padding:calc(var(--top-h, 64px) + 20px) var(--gutter) 110px}
.hero .art{position:absolute;inset:0;background-size:cover;background-position:center 25%;transition:opacity .8s ease,transform 1.4s var(--ease);transform:scale(1.05)}
.hero .art.show{transform:none}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(46,34,47,.95) 0,rgba(46,34,47,.55) 38%,transparent 70%),linear-gradient(0deg,var(--bg) 0,rgba(46,34,47,.2) 30%,transparent 55%),linear-gradient(180deg,rgba(46,34,47,.7),transparent 25%)}
.hero .inner{position:relative;z-index:2;max-width:min(620px,100%);padding:28px;border-radius:24px}
.hero .kicker{display:flex;gap:8px;align-items:center;font-size:.78rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.hero .kicker .bar{width:28px;height:3px;border-radius:3px;background:var(--grad)}
.hero .logo{max-width:min(420px,100%);max-height:150px;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 6px 24px rgba(0,0,0,.7));margin-bottom:14px}
.hero h1{font-size:clamp(2rem,4.6vw,3.6rem);line-height:1.02;margin:0 0 14px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.hero p{color:#e6dcea;line-height:1.55;margin:12px 0 22px;font-size:1.02rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero .meta,.hero .actions{display:flex;gap:8px;flex-wrap:wrap}
.hero .actions{gap:10px}
.hero .pager{display:flex;gap:6px;margin-top:20px}
.hero .pager button{width:26px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);transition:width .3s,background-color .3s}
.hero .pager button.on{width:44px;background:#fff}
.hero-fade-in{animation:heroIn .6s var(--ease) both}
@keyframes heroIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero.slim{height:auto;min-height:0;margin-top:0;padding-top:8px}
.hero.slim::after,.hero.slim .art,.hero.slim .pager{display:none}

/* ---------- rows ---------- */
main{position:relative;z-index:2;margin-top:-90px;padding-bottom:60px}
.hero.slim + main{margin-top:0}
.row{position:relative;content-visibility:auto;contain-intrinsic-size:auto 250px}
.row h2{display:flex;align-items:baseline;gap:12px;margin:0 var(--gutter);padding-top:16px;font-size:1.25rem;font-weight:700}
.row h2 small{color:var(--dim);font-weight:500;font-size:.85rem}
.row h2 .sub{color:var(--muted);font-weight:400;font-size:.88rem;margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;padding:16px var(--gutter) 22px;scroll-snap-type:x proximity;scroll-padding-inline:var(--gutter);scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:56px;bottom:18px;width:52px;z-index:6;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.arrow svg{width:30px;height:30px;filter:drop-shadow(0 2px 8px #000)}
.arrow.l{left:0;background:linear-gradient(90deg,rgba(46,34,47,.85),transparent)}
.arrow.r{right:0;background:linear-gradient(270deg,rgba(46,34,47,.85),transparent)}
.row:hover .arrow{opacity:1}
.arrow[hidden]{display:none}

.card{position:relative;flex:0 0 var(--card-w);aspect-ratio:460/215;border-radius:14px;scroll-snap-align:start;cursor:pointer;outline:none;transition:transform .3s var(--ease)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  box-shadow:0 22px 46px -14px rgba(0,0,0,.95),0 0 0 2px rgba(255,255,255,.6),0 0 38px -6px rgba(168,132,243,.7)}
.card .frame{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:#3e3546;border:1px solid var(--stroke);contain:strict}
.card img.cover{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.card.notinst .frame::before{content:"";position:absolute;inset:0;z-index:1;background:rgba(46,34,47,.38);transition:opacity .3s;pointer-events:none}
.card .shade{position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(46,34,47,.92) 0,rgba(46,34,47,.2) 48%,transparent 70%);opacity:0;transition:opacity .25s}
.card .badges{position:absolute;z-index:2;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.card .pl{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:4px 8px;border-radius:8px;background:rgba(46,34,47,.8);border:1px solid rgba(255,255,255,.14)}
.card .pl svg{width:13px;height:13px}
.card .flags{display:flex;gap:4px}
.card .flag{font-size:.66rem;font-weight:800;letter-spacing:.06em;padding:4px 7px;border-radius:7px}
.flag.lan{background:#91db69;color:#2e222f}
.flag.couch{background:#f04f78;color:#2e222f}
.flag.get{background:#fbb954;color:#2e222f}
.card .info{position:absolute;z-index:2;left:12px;right:12px;bottom:10px;transform:translateY(8px);opacity:0;transition:transform .25s,opacity .25s}
.card .info b{display:block;font-size:.98rem;font-weight:700;line-height:1.2;text-shadow:0 2px 10px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .info span{font-size:.75rem;color:var(--muted);text-transform:capitalize}
.card .idot{position:absolute;z-index:2;right:10px;bottom:10px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);transition:opacity .25s}
@media (hover:hover){
  .card:hover{transform:scale(1.08) translateY(-3px);z-index:4}
  .card:hover::after{opacity:1}
  .card:hover img.cover{transform:scale(1.05)}
  .card:hover .shade,.card:hover .info{opacity:1}
  .card:hover .info{transform:none}
  .card:hover .idot,.card:hover .frame::before{opacity:0}
}
.card:focus-visible{transform:scale(1.08) translateY(-3px);z-index:4}
.card:focus-visible::after,.card:focus-visible .shade,.card:focus-visible .info,.card.noart .shade,.card.noart .info{opacity:1}
.card:focus-visible .info,.card.noart .info{transform:none}
.card .ph{position:absolute;inset:0;display:grid;place-items:center;padding:14px;text-align:center;font-weight:800;font-size:1.2rem;letter-spacing:.02em;line-height:1.1}
.card.noart .info b{display:none}
.track .card:first-child{transform-origin:left center}
.track .card:last-child{transform-origin:right center}
.card.more-cards{display:grid;place-items:center;color:var(--muted);font-weight:600;background:var(--solid);border:1px dashed var(--stroke-2);border-radius:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px 14px;padding:14px var(--gutter)}
.grid .card{flex:none;width:auto}
.sentinel{height:1px}
.results-head{margin:8px var(--gutter) 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.results-head h2{margin:0;font-size:1.3rem}
.results-head small{color:var(--muted)}
.empty{margin:30px var(--gutter);padding:36px;border-radius:20px;text-align:center;color:var(--muted);line-height:1.6}
.empty b{color:var(--text)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(30,22,31,.74);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;overscroll-behavior:contain;padding:40px 16px;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.overlay.open{opacity:1;visibility:visible;transition:opacity .25s}
.modal{position:relative;width:min(1000px,100%);border-radius:22px;overflow:hidden;background:rgba(52,42,58,.86);border:1px solid var(--stroke);backdrop-filter:saturate(150%) blur(22px);-webkit-backdrop-filter:saturate(150%) blur(22px);box-shadow:0 40px 120px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.08);transform:translateY(20px) scale(.98);transition:transform .4s var(--ease)}
.overlay.open .modal{transform:none}
.overlay.fly .modal{transition:none} /* the art flies in: the panel itself doesn't also slide */
.flyart{position:fixed;z-index:300;pointer-events:none;overflow:hidden;box-shadow:0 30px 80px -24px rgba(0,0,0,.85);will-change:left,top,width,height}
.flyart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mhero{position:relative;width:100%;aspect-ratio:1920/700;min-height:200px;overflow:hidden;background:#3e3546}
.mhero img.bg,.mhero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mhero.boxart img.blur{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transform:scale(8.4);transform-origin:0 0;object-fit:cover;filter:blur(3px) brightness(.6) saturate(140%)}
.mhero.boxart img.bg{object-fit:contain;object-position:right center;padding:18px 28px 18px 40%}
.mhero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(52,42,58,1) 0,rgba(52,42,58,.4) 45%,transparent 75%)}
.mhero .lg{position:absolute;z-index:2;left:32px;bottom:22px;max-width:min(380px,60%);max-height:42%;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 6px 22px rgba(0,0,0,.8))}
.mhero h2{position:absolute;z-index:2;left:32px;right:32px;bottom:18px;margin:0;font-size:clamp(1.7rem,3.5vw,2.6rem);font-weight:800;letter-spacing:-.015em;line-height:1.05;text-shadow:0 4px 30px rgba(0,0,0,.8)}
.close{position:absolute;z-index:5;top:14px;right:14px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(46,34,47,.7);border:1px solid var(--stroke);transition:transform .2s,background-color .2s}
.close:hover{transform:rotate(90deg);background:rgba(74,63,84,.9)}
.close svg{width:20px;height:20px}
.mbody{padding:8px 32px 32px;display:grid;grid-template-columns:1.6fr 1fr;gap:28px}
.stagger>*{animation:rise .45s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.04s}.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.12s}.stagger>*:nth-child(5){animation-delay:.16s}.stagger>*:nth-child(6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mchips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.bigplayers{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;margin-bottom:16px}
.bigplayers .n{font-size:2rem;font-weight:800;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.bigplayers .l{font-size:.82rem;color:var(--muted);line-height:1.35}
.bigplayers .fit{margin-left:auto;font-size:.8rem;font-weight:700;padding:6px 10px;border-radius:10px}
.fit.yes{background:rgba(145,219,105,.15);color:#d4f4bf}.fit.no{background:rgba(232,59,59,.14);color:#ffc9c9}
.desc{color:#ece4f0;line-height:1.65;margin:0 0 16px;font-size:1.02rem}

  for (const w of words) {

    const short = w.length <= 2;                                                  // short words: title only, no substring noise
    if (w.length >= 2 && g._ini.startsWith(w)) hit = 90;
    if (g._alias.includes(w)) hit = 95;
    if ((" " + g._t).includes(" " + w)) hit = Math.max(hit, 60);               // word prefix in title
    else if (!short && g._t.includes(w)) hit = Math.max(hit, 30);
    else if (!short && g._tc.includes(w)) hit = Math.max(hit, 25);
    else if (!short && g._h.includes(" " + w)) hit = Math.max(hit, 8);          // word prefix in description/tags
    else if (w.length >= 4 && g._h.includes(w)) hit = Math.max(hit, 4);
    if (!hit) return 0;                                                // every word must match somewhere
    s += hit;
  }
  return s + (g.installed ? 4 : 0) + (g.lan ? 2 : 0);
}

/* ================================================= state */
const S = { squad: store.get("squad", 1), filter: store.get("filter", "all"), view: store.get("view", "rows"), q: "",
            server: false, ips: [], built: null, scanning: false, banner: store.get("banner", true) };
const FILTERS = [
  ["all", "Everything", () => true],
  ["ready", "Ready to play", g => g.installed],
  ["lan", "LAN / offline", g => g.lan],
  ["couch", "Couch (1 PC)", g => g.couch >= 2],
  ["installers", "Installers & archives", g => g.source === "local" && !g.installed],
  ["notinst", "Not installed (Steam)", g => g.source === "steam" && !g.installed],
];
const fits = (g, n) => n <= 1 || g.guess || (g.pmax >= n && g.pmin <= n) || g.couch >= n;
const statusLabel = g => g.source === "steam" ? (g.installed ? "Installed" : "Not installed") :
  ({installed:"Installed", installer:"Installer ready", folder:"Folder", store:"Free on Steam"})[g.status] || "";
const sortPlay = (a, b) => (b.installed - a.installed) || (b.lan - a.lan) || ((b.lanCollection|0) - (a.lanCollection|0)) || (a.guess|0) - (b.guess|0) || a.title.localeCompare(b.title);
function baseList() {
  const f = (FILTERS.find(f => f[0] === S.filter) || FILTERS[0])[2];
  return G.filter(g => f(g) && fits(g, S.squad));
}

/* ================================================= cards (cached html) */
const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const phStyle = g => { const h = hash(g.title) % 360; return `background:linear-gradient(135deg,hsl(${h} 70% 30%),hsl(${(h+60)%360} 75% 18%));`; };
function cardHTML(g) {
  if (g._card) return g._card;
  const flags = [];
  if (g.lan) flags.push('<span class="flag lan">LAN</span>');
  if (g.couch >= 2) flags.push(`<span class="flag couch">${g.couch}P COUCH</span>`);
  if (!g.installed) flags.push(`<span class="flag get">${g.status === "installer" ? "SETUP" : "GET"}</span>`);
  if (g.platform === "xbox") flags.push('<span class="flag couch">XBOX</span>');
  const img = g.img && g.img.cover;
  return (g._card = `<div class="card${g.installed ? "" : " notinst"}${img ? "" : " noart"}" tabindex="0" data-id="${esc(g.id)}"><div class="frame">${
    img ? `<img class="cover" loading="lazy" decoding="async" width="460" height="215" src="${esc(img)}" alt="">` : `<div class="ph" style="${phStyle(g)}">${esc(g.title)}</div>`
  }<div class="shade"></div><div class="badges"><span class="pl">${ICON.users}${esc(g.players)}</span><span class="flags">${flags.join("")}</span></div><div class="info"><b>${esc(g.title)}</b><span>${esc(GENRE[g.genre] || g.genre)} · ${esc(statusLabel(g))}</span></div>${g.installed ? '<span class="idot"></span>' : ""}</div></div>`);
}

/* rows render a first batch; more cards are appended as you scroll the row.
   The batch and the arrows follow the window width (from the CSS card size, without laying out off-screen rows):
   a fixed count left the right edge of an ultrawide screen empty until a hover filled it in, and showed a ›
   on rows that already fit. */
const BATCH = 18, rowLists = new Map();
function rowMetrics() {
  const cs = getComputedStyle(document.documentElement);
  const w = parseFloat(cs.getPropertyValue("--card-w")) || 300, gut = parseFloat(cs.getPropertyValue("--gutter")) || 28, gap = 14;
  const slots = (document.documentElement.clientWidth - 2 * gut + gap) / (w + gap);
  return {fit: Math.max(1, Math.floor(slots)), first: Math.ceil(slots) + 3};   // whole cards that fit · cards to render up front
}
let RM = rowMetrics();
function rowHTML(key, emoji, title, sub, list) {
  if (!list.length) return "";
  rowLists.set(key, list);
  const first = Math.min(RM.first, list.length);
  return `<section class="row" data-row="${key}" data-n="${first}">
    <h2><span>${emoji}</span>${esc(title)}<small>${list.length}</small>${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</h2>
    <button class="arrow l" aria-label="Scroll left" hidden>${ICON.l}</button>
    <div class="track">${list.slice(0, first).map(cardHTML).join("")}</div>
    <button class="arrow r" aria-label="Scroll right"${list.length <= RM.fit ? " hidden" : ""}>${ICON.r}</button></section>`;
}
function growRow(row, count = BATCH) {
  const list = rowLists.get(row.dataset.row); if (!list) return;
  const n = +row.dataset.n; if (n >= list.length) return;
  row.querySelector(".track").insertAdjacentHTML("beforeend", list.slice(n, n + count).map(cardHTML).join(""));
  row.dataset.n = Math.min(list.length, n + count);
}
function setupRow(row) {
  const t = row.querySelector(".track"), l = row.querySelector(".arrow.l"), r = row.querySelector(".arrow.r");
  let ticking = false;
  const upd = row._upd = () => {
    ticking = false;
    const end = t.scrollLeft + t.clientWidth;
    if (end > t.scrollWidth - t.clientWidth * 1.2) growRow(row);
    l.hidden = t.scrollLeft < 10; r.hidden = end >= t.scrollWidth - 10 && +row.dataset.n >= rowLists.get(row.dataset.row).length;
  };
  l.onclick = () => t.scrollBy({left: -t.clientWidth * .85});
  r.onclick = () => { growRow(row); t.scrollBy({left: t.clientWidth * .85}); };
  t.addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(upd); } }, {passive: true});
  row.addEventListener("pointerenter", () => growRow(row, 6), {once: true, passive: true});
  /* Tab walks the cards: load the next ones before focus reaches the last rendered card, or it would skip to the next row */
  t.addEventListener("focusin", e => { const c = e.target.closest(".card"); if (c && !c.nextElementSibling?.nextElementSibling?.nextElementSibling) growRow(row); });
}
/* window resized (or moved to another screen): fill the new width and re-check the arrows */
let rowRT;
addEventListener("resize", () => { clearTimeout(rowRT); rowRT = setTimeout(() => {
  const m = rowMetrics(); if (m.fit === RM.fit && m.first === RM.first) return;
  RM = m;
  document.querySelectorAll("#content .row").forEach(row => {
    const n = +row.dataset.n; if (n < RM.first) growRow(row, RM.first - n);
    if (row._upd) row._upd();
  });
}, 150); });

/* grid / results render in chunks via an IntersectionObserver sentinel */
let gridList = [], gridN = 0, gridIO = null;
function gridHTML(list) {
  gridList = list; gridN = Math.min(list.length, 48);
  return `<div class="grid" id="grid">${list.slice(0, gridN).map(cardHTML).join("")}</div><div class="sentinel" id="sentinel"></div>`;
}
function setupGrid() {
  if (gridIO) gridIO.disconnect();
  const s = $("#sentinel"); if (!s) return;
  gridIO = new IntersectionObserver(es => {
    if (!es[0].isIntersecting || gridN >= gridList.length) return;
    $("#grid").insertAdjacentHTML("beforeend", gridList.slice(gridN, gridN + 48).map(cardHTML).join(""));
    gridN = Math.min(gridList.length, gridN + 48);
    /* the observer only fires when the sentinel crosses the margin: on a tall/wide screen 48 more cards may not
       push it out, and the grid would stop loading for good. Re-observing reports the current state again. */
    if (gridN < gridList.length) { gridIO.unobserve(s); gridIO.observe(s); }
  }, {rootMargin: "800px"});
  gridIO.observe(s);
}

/* ================================================= render */
function render() {
  rowLists.clear();

      n > 1 ? rowHTML("squad", "👥", `Fits all ${n} of you · LAN-ready & installed`, "", V.filter(g => g.lan && g.installed && !g.guess).sort((a,b) => a.pmax - b.pmax)) : "",
      rowHTML("couch", "🛋️", "One PC, many controllers", "split-screen, shared screen & phone games", V.filter(g => g.couch >= 2 && g.installed).sort(sortPlay)),
      rowHTML("shoot", "🔫", "Frag fests & shooters", "", V.filter(inG("shooter")).sort(sortPlay)),
      rowHTML("party", "🎉", "Party, brawlers & mayhem", "", V.filter(inG("party","fighting")).sort(sortPlay)),
      rowHTML("coop", "🤝", "Co-op adventures & dungeon crawls", "", V.filter(inG("coop","rpg")).sort(sortPlay)),
      rowHTML("surv", "⛏️", "Survival, crafting & sandbox", "", V.filter(inG("survival","sandbox")).sort(sortPlay)),
      rowHTML("race", "🏁", "Racing & sports", "", V.filter(inG("racing","sports")).sort(sortPlay)),
      rowHTML("strat", "♟️", "Strategy, RTS & board games", "", V.filter(inG("strategy")).sort(sortPlay)),

      rowHTML("drives", "🗂️", "Found on your other drives", "curated games outside the LAN folder", V.filter(g => g.source === "local" && !g.vault && !g.unknown).sort(sortPlay)),
      rowHTML("unknown", "❔", "Other games found", "auto-detected folders, no player info yet", V.filter(g => g.unknown).sort((a,b) => a.title.localeCompare(b.title))),
      rowHTML("get", "📥", "In your Steam library · not installed", "LAN-capable first", V.filter(g => g.source === "steam" && !g.installed).sort((a,b) => (b.lan-a.lan) || (b.pmax-a.pmax))),

/* ================================================= hero */
let heroList = [], heroIdx = 0, heroTimer;
function pickHero() {
  const ok = g => g.img && g.img.hero;
  const pool = G.filter(g => g.installed && ok(g) && (g.lanCollection || g.lan) && fits(g, S.squad));
  const src = pool.length >= 3 ? pool : G.filter(ok);
  heroList = src.sort(() => Math.random() - .5).slice(0, 6);
  heroIdx = 0; showHero();
}
function showHero() {
  clearTimeout(heroTimer);
  const el = $("#hero"), g = heroList[heroIdx];
  if (!g) { el.className = "hero slim"; el.innerHTML = ""; return; }
  el.className = "hero";
  const art = g.img.hero || g.img.cover;
  const img = new Image(); img.decoding = "async"; img.src = art;   // decode before swapping: no jank
  (img.decode ? img.decode() : Promise.resolve()).catch(() => {}).then(() => {
    const prev = el.querySelectorAll(".art");
    const a = document.createElement("div"); a.className = "art"; a.style.backgroundImage = `url("${art}")`; a.style.opacity = 0;
    el.prepend(a);
    requestAnimationFrame(() => requestAnimationFrame(() => { a.style.opacity = 1; a.classList.add("show"); prev.forEach(p => { p.style.opacity = 0; setTimeout(() => p.remove(), 800); }); }));
    el.querySelectorAll(".inner,.pager").forEach(n => n.remove());
    el.insertAdjacentHTML("beforeend", `<div class="inner glass hero-fade-in">
      <div class="kicker"><span class="bar"></span>${g.lanCollection ? "From your LAN collection" : "Tonight's pick"}</div>
      ${g.img.logo ? `<img class="logo" src="${esc(g.img.logo)}" alt="${esc(g.title)}">` : `<h1>${esc(g.title)}</h1>`}
      <div class="meta">${badges(g).join("")}</div>
      <p>${esc(g.desc || g.note || "")}</p>
      <div class="actions">${primaryBtn(g)}<button class="btn btn-glass" data-open="${esc(g.id)}">${ICON.info}More info</button></div>
      <div class="pager">${heroList.map((_, i) => `<button class="${i===heroIdx?"on":""}" data-h="${i}" aria-label="Slide ${i+1}"></button>`).join("")}</div>
    </div>`);
    if (!openId) setBg(art);
    heroTimer = setTimeout(() => { if (document.hidden || openId) { heroTimer = setTimeout(showHero, 3000); return; } heroIdx = (heroIdx + 1) % heroList.length; showHero(); }, 9000);
  });
}

async function poll() {
  clearTimeout(pollT);
  if (!SERVED) { setStatus("off", "Static mode · start the launcher to play"); renderBanner(); return; }
  try {
    const j = await (await fetch("/api/ping", {cache: "no-store"})).json();
    if (S.version && j.version && j.version !== S.version) { location.reload(); return; }   // updated underneath us
    S.version = j.version; S.restarting = false;
    S.server = true; S.ips = j.ips || []; S.scanning = j.scanning; S.consented = j.consented;
    S.error = j.error; S.update = j.update; S.allow = j.allow || {};
    const inst = (j.installing || []).join("|");
    if (inst !== (S.installing || []).join("|")) {
      S.installing = j.installing || [];
      for (const g of G) g._card = null;
      if (modalKind === "game" && openId && byId[openId]) refreshModal();
    }
    if ((j.built && j.built !== (DATA && DATA.built)) || !S.loadedOnce) await reloadData();
    if (j.error && !j.scanning) setStatus("err", "Scan failed: " + j.error);
    else setStatus(j.scanning ? "busy" : "on", !j.consented ? "Waiting for your permission" : j.scanning ? `Scanning · ${j.phase}` : S.ips.length ? `Launcher online · IP ${S.ips[0]}` : "Launcher online");
    if (!j.consented && modalKind !== "consent") openConsent();
    else if (S.wantSettings && j.consented) { S.wantSettings = false; openSettings(); }
  } catch { S.server = false; if (S.updating) S.restarting = true; setStatus("off", S.restarting ?"Restarting after the update…" : "Launcher stopped · start LAN Hub.exe"); }
  renderBanner();
  pollT = setTimeout(poll, S.scanning || S.restarting || (S.update && S.update.busy) || (S.installing || []).length ? 2000 : 15000);
}
async function reloadData() {
  try {
    const r = await fetch("data/games.json", {cache: "no-store"});
    S.loadedOnce = true;
    if (!r.ok) return;
    setData(await r.json()); render(); footer();
    // hero: keep the current slides if they still exist, otherwise pick new ones (bug 4)
    heroList = heroList.map(g => byId[g.id]).filter(Boolean);
    if (heroList.length < 3) pickHero(); else { heroIdx = Math.min(heroIdx, heroList.length - 1); showHero(); }
    if (modalKind === "game" && openId && !byId[openId]) closeModal();
    if (S.pendingG && byId[S.pendingG]) { openModal(S.pendingG); S.pendingG = null; }
  } catch { S.loadedOnce = true; }
}
function setStatus(kind, txt) {
  const el = $("#status"); el.className = "status glass " + kind; $("#statusTxt").textContent = txt;
  el.title = S.ips.length ? "Friends connect to: " + S.ips.join(", ") + " (click to copy)" : txt;
}
async function act(action, id, url) {
  const g = byId[id];
  if (S.server) {
    const j = await api("/api/do", {id, action, url}); if (!j) return;
    if (action === "install" && !isArchive(g.installPath) && /\.(exe|msi)$/i.test(g.installPath || "")) {
      toast(`📦 ${esc(g.title)} installer started. When it closes, LAN Hub looks for the game and the tile turns into <b>Play</b>.`, "ok", 6000);
      S.installing = [...new Set([...(S.installing || []), id])]; g._card = null;
      if (modalKind === "game" && openId === id) refreshModal();
      poll(); return;
    }
    toast(action === "launch" ? `🚀 Launching ${esc(g.title)}…` : action === "install" ? `📦 Opening ${esc(g.title)}` :action === "folder" ? "📁 Folder opened" : (url.includes("install") ? "⬇️ Steam is installing " : "🚀 Steam is starting ") + esc(g.title), "ok");
    return;
  }
  if (action === "steam" && url) { location.href = url; toast(`Handing ${esc(g.title)} to Steam…`, "ok"); return; }
  const p = action === "launch" ? g.launchPath : action === "install" ? g.installPath : (g.folderPath || g.path);
  copy(p, false);
  toast(`Start <b>LAN Hub.exe</b> to do this from the page. Path copied: <code>${esc(p || "")}</code>`, "err", 6500);
}
function copy(text, notify = true) {
  if (!text) return;
  const done = () => notify && toast("Copied: " + esc(text), "ok");
  const fallback = () => { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); done(); } catch {} t.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
function toast(html, kind = "", ms = 3200) {
  const t = document.createElement("div"); t.className = `toast ${kind}`; t.innerHTML = html;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.transition = "opacity .35s, transform .35s"; t.style.opacity = 0; t.style.transform = "translateY(10px)"; setTimeout(() => t.remove(), 350); }, ms);
}

/* ================================================= roulette */
let roulWinner = null, rolling = false;
function roll() {
  const pool = baseList().filter(g => g.installed && !g.unknown && (S.squad > 1 ? (g.lan || g.couch >= S.squad) : true));
  const final = pool;
  if (rolling) return;
  if (!final.length) { toast(G.length ? "No installed games match this filter and squad size. Try “Everything” or a smaller squad." : "No games scanned yet.", "err", 4500); return; }
  if (!$("#roul").classList.contains("open")) lastFocus = document.activeElement;
  rolling = true;
  $("#roul").classList.add("open");
  $("#roulTitle").textContent = S.squad > 1 ? `Rolling for a squad of ${S.squad}…` : "Rolling…";
  $("#roulOpen").disabled = $("#reroll").disabled = true;
  const slot = $("#slot"); slot.classList.remove("win");
  const winner = final[Math.floor(Math.random() * final.length)];
  let i = 0, delay = 45; const steps = 24;
  const tick = () => {
    const g = i >= steps ? winner : final[Math.floor(Math.random() * final.length)];
    slot.innerHTML = g.img.cover ? `<img src="${esc(g.img.cover)}" alt="" decoding="sync">` : `<div class="ph" style="${phStyle(g)}">${esc(g.title)}</div>`;
    $("#roulName").textContent = g.title; $("#roulSub").textContent = `${g.players} players · ${GENRE[g.genre] || g.genre}${g.lan ? " · LAN" : ""}`;
    if (i++ < steps) { delay *= 1.11; setTimeout(tick, delay); }
    else { slot.classList.add("win"); roulWinner = winner; rolling = false; $("#roulOpen").disabled = $("#reroll").disabled = false; $("#roulTitle").textContent = "Tonight you're playing"; $("#roulOpen").focus(); }
  };
  tick();
}

/* ================================================= events */
document.addEventListener("click", async e => {
  const t = e.target;
  const cp = t.closest("[data-copy]"); if (cp) return copy(cp.dataset.copy);
  const a = t.closest("[data-act]"); if (a) { e.stopPropagation(); return act(a.dataset.act, a.dataset.id, a.dataset.url); }
  if ((t.closest("[data-close]") || t === $("#overlay")) && modalKind !== "consent") return closeModal();
  if (t.closest("[data-banner]")) { S.banner = false; store.set("banner", false); return renderBanner(); }
  if (t.closest("#pickroot")) { const b = t.closest("#pickroot"); b.disabled = true; toast("A folder picker opened (it can hide behind the browser).", "", 4000); const r = await api("/api/pickfolder"); b.disabled = false; if (r && r.path) addRoot(r.path); return; }
  if (t.closest("#addroot")) { P.typed = ""; return addRoot($("#rootin").value); }
  const rt = t.closest("[data-rtoggle]");
  if (rt) {
    const g = rt.closest(".rgroup"), k = rt.dataset.rtoggle, open = !g.classList.contains("open");
    g.classList.toggle("open", open); rt.setAttribute("aria-expanded", open);
    if (open) P.open.add(k); else P.open.delete(k);
    if (open && k === "own") { const i = $("#rootin"); if (i) i.focus({preventScroll: true}); }
    return;
  }
  if (t.closest("#permsave")) return savePerms();
  if (t.closest("#rescan")) { if (await api("/api/rescan")) { toast("Rescanning…", "ok"); poll(); } return; }
  const dn = t.closest("[data-done]");
  if (dn) { if (await api("/api/installdone", {id: dn.dataset.done})) { toast("Looking for the installed game…", "ok"); setTimeout(poll, 800); } return; }
  const lc = t.closest("[data-locate]");
  if (lc) {
    lc.disabled = true; toast("A file picker opened (it can hide behind the browser). Pick the game's .exe.", "", 5000);
    const r = await api("/api/locate", {id: lc.dataset.locate}); lc.disabled = false;
    if (r && r.path) { toast(`Got it: <code>${esc(r.path)}</code>. The tile turns into Play in a moment.`, "ok", 5000); setTimeout(poll, 800); }
    return;
  }
  const fg = t.closest("[data-forget]");
  if (fg) { if (await api("/api/forget", {id: fg.dataset.forget})) { toast("Forgotten. Rescanning…", "ok"); setTimeout(poll, 800); } return; }
  if (t.closest("#updnow")) {
    const b = t.closest("#updnow"); b.disabled = true;
    if (await api("/api/update/install")) { S.updating = true; S.update = {...S.update, busy: true}; renderBanner(); poll(); } else b.disabled = false;
    return;
  }
  if (t.closest("#updskip")) { store.set("skipUpdate", S.update && S.update.latest); return renderBanner(); }
  if (t.closest("#updcheck")) { if (await api("/api/update/check")) { toast("Asking GitHub…", "ok"); setTimeout(async () => { await poll(); toast(S.update && S.update.available ? `LAN Hub ${esc(S.update.latest)} is available` : S.update && S.update.error ? esc(S.update.error) : "You have the latest version.", S.update && S.update.error ? "err" : "ok"); store.set("skipUpdate", ""); }, 2500); } return; }
  const o = t.closest("[data-open]"); if (o) return openModal(o.dataset.open);
  const c = t.closest(".card[data-id]"); if (c) return openModal(c.dataset.id);
  const f = t.closest("[data-f]"); if (f) { S.filter = f.dataset.f; store.set("filter", S.filter); return scheduleRender(); }
  const v = t.closest("[data-v]"); if (v) { S.view = v.dataset.v; store.set("view", S.view); return scheduleRender(); }
  const h = t.closest("[data-h]"); if (h) { heroIdx = +h.dataset.h; return showHero(); }
});
document.addEventListener("keydown", e => {
  const inInput = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "Tab") {
    if ($("#roul").classList.contains("open")) return trapTab(e, $("#roul"));
    if (modalKind) return trapTab(e, $("#modal"));
  }
  if (e.key === "Escape") {
    if ($("#roul").classList.contains("open")) { $("#roul").classList.remove("open"); restoreFocus(); }
    else if (modalKind && modalKind !== "consent") closeModal();
    else if (S.q) { $("#q").value = ""; S.q = ""; scheduleRender(); $("#q").blur(); }
  }
  else if (e.key === "/" && !inInput) { e.preventDefault(); $("#q").focus(); }
  else if (e.key === "Enter" && document.activeElement.classList.contains("card")) openModal(document.activeElement.dataset.id);
  else if (e.key === "Enter" && document.activeElement.id === "rootin") addRoot(document.activeElement.value);
  else if (e.key === "Enter" && document.activeElement === $("#q")) { const first = $("#content .card"); if (first) openModal(first.dataset.id); }
  else if ((e.key === "r" || e.key === "R") && !inInput && !modalKind) roll();
});
let qT;
$("#q").addEventListener("input", e => {
  clearTimeout(qT);
  const v = e.target.value.trim();
  qT = setTimeout(() => { if (v !== S.q) { S.q = v; scheduleRender(); if (v) scrollTo({top: Math.min(scrollY, $("#main").offsetTop - 70)}); } }, 90);
});
let sqT;
const setSquad = n => { S.squad = Math.max(1, Math.min(64, n)); $("#sq").textContent = S.squad; store.set("squad", S.squad); clearTimeout(sqT); sqT = setTimeout(scheduleRender, 120); };
$("#sqm").onclick = () => setSquad(S.squad - 1);
$("#sqp").onclick = () => setSquad(S.squad + 1);
$("#pick").onclick = roll; $("#reroll").onclick = roll;
$("#gear").onclick = openSettings;
$("#roulClose").onclick = () => { $("#roul").classList.remove("open"); restoreFocus(); };
$("#roulOpen").onclick = () => { $("#roul").classList.remove("open"); lastFocus = null; S.focusReturn = $("#pick"); if (roulWinner) openModal(roulWinner.id); };
$("#status").onclick = () => S.ips.length && copy(S.ips[0]);
const syncTop = () => document.documentElement.style.setProperty("--top-h", $("#top").offsetHeight + "px");
syncTop(); if (window.ResizeObserver) new ResizeObserver(syncTop).observe($("#top")); else addEventListener("resize", syncTop);
let scrolled = false;
addEventListener("scroll", () => { const s = scrollY > 20; if (s !== scrolled) { scrolled = s; $("#top").classList.toggle("scrolled", s); } }, {passive: true});
document.addEventListener("error", e => {
  const im = e.target;
  if (im.tagName !== "IMG") return;
  if (im.classList.contains("cover")) { const c = im.closest(".card"), g = c && byId[c.dataset.id]; if (g) { c.classList.add("noart"); im.outerHTML = `<div class="ph" style="${phStyle(g)}">${esc(g.title)}</div>`; } }
  else if (im.classList.contains("lg") || im.classList.contains("logo")) { const h = document.createElement(im.classList.contains("lg") ? "h2" : "h1"); h.textContent = im.alt; im.replaceWith(h); }
}, true);

/* ================================================= boot */
function footer() {
  $("#built").textContent = G.length ? `${G.length} games · ${G.filter(g => g.installed).length} installed · ${G.filter(g => g.lan).length} LAN-capable · scanned ${DATA.built || "?"}${DATA.host ? " on " + DATA.host : ""}` : "";
}
setData(window.LAN_HUB);
$("#sq").textContent = S.squad;
footer(); render(); renderBanner(); pickHero(); poll();

if (location.hash === "#settings") { S.wantSettings = true; history.replaceState(null, "", location.pathname); }
if (location.hash.startsWith("#g/")) { let id = ""; try { id = decodeURIComponent(location.hash.slice(3)); } catch {} if (byId[id]) openModal(id); else S.pendingG = id; }
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
})();
</script>
</body>
